# Example configuration for mcp-odoo-panda
# Copy this file and fill in your values:
#   cp odoo_mcp/config/config.example.yaml odoo_mcp/config/config.yaml
#
# Security:
# - Never commit real passwords or API keys.
# - Prefer environment variables (ODOO_URL, ODOO_DB, ODOO_USER, ODOO_PASSWORD)
#   over hardcoding credentials here.

# Odoo connection (REQUIRED — replace placeholders)
odoo_url: http://localhost:8069
database: your_database
username: your_username
api_key: your_password_or_api_key   # placeholder — do not commit real secrets

# Odoo RPC protocol
protocol: xmlrpc  # or jsonrpc

# How MCP clients talk to this server:
# - stdio           → Claude Desktop / Cursor (local process, recommended for desktop)
# - streamable_http → remote / HTTP clients (POST /mcp)
# - sse             → legacy SSE transport (avoid for new setups)
connection_type: stdio
transport_type: stdio

requests_per_minute: 120
rate_limit_max_wait_seconds: 5
pool_size: 5
timeout: 30
session_timeout_minutes: 60

# HTTP settings — only used when connection_type/transport_type is http or streamable_http
# DEV-ONLY defaults below. For production: bind 127.0.0.1 (or a private interface)
# and set explicit CORS origins (never "*").
http:
  host: 0.0.0.0   # DEV-ONLY: all interfaces. Prefer 127.0.0.1 for local-only.
  port: 8080
  streamable: false  # true when using streamable_http

# SSE settings — only used when connection_type is sse
sse:
  host: 0.0.0.0   # DEV-ONLY
  port: 8080
  queue_maxsize: 1000
  allowed_origins: ["*"]  # DEV-ONLY. Production: list explicit origins.
  ping_interval: 30

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - type: StreamHandler
      level: INFO
    - type: FileHandler
      filename: server.log
      level: DEBUG
